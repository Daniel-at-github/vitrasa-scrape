repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # ty has no official pre-commit hook yet, so run the version pinned in the dev group.
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run --frozen ty check
        language: system
        types: [python]
        pass_filenames: false
