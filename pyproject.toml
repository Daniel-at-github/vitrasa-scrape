[project]
name = "vitrasa-git-scrape"
version = "1.0.0"
description = "Git scraping of Vitrasa (Vigo) bus data: static network, theoretical timetable, all-stops realtime snapshots."
requires-python = ">=3.12"
# The fetcher is stdlib-only by design, so the 15-min CI job installs nothing.
# Analysis tooling lives in the `dev` group (not installed by the scrape workflow).
dependencies = []

[dependency-groups]
dev = [
    "altair>=5.4",
    "duckdb>=1.3",
    "marimo>=0.18.1",
    "pandas>=2.2",
]

[tool.uv]
package = false   # scripts repo, not an installable package
